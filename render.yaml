# render.yaml - Render Blueprint configuration for vsearch
services:
  - type: web
    name: vsearch-demo
    runtime: docker
    plan: free
    healthCheckPath: /health
    region: singapore
    branch: main
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: VSEARCH_DATA_DIR
        value: /app/vsearch_data
      - key: VSEARCH_SNAPSHOT_INTERVAL
        value: "300"
      - key: VSEARCH_SEED_ON_START
        value: "0"
      - key: VSEARCH_MAX_VECTORS
        value: "50000"
      - key: VSEARCH_MAX_K
        value: "100"
      - key: VSEARCH_MAX_EF
        value: "500"
      - key: VSEARCH_MAX_BATCH
        value: "100"
      - key: VSEARCH_API_KEY
        sync: false
      - key: VSEARCH_READ_KEY
        sync: false
      - key: VSEARCH_PUBLIC_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ASSISTANT_DAILY_CAP
        value: "300"
