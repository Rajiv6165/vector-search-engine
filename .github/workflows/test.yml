name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -v -e .
        python -c "import vsearch.hnsw; print('HAS_NATIVE:', vsearch.hnsw.HAS_NATIVE); assert vsearch.hnsw.HAS_NATIVE is True, 'Native extension failed to build or load!'"
        
    - name: Test with pytest
      run: |
        python -m pytest tests/ -v --tb=short | tee pytest.log || (echo "### Pytest output" >> $GITHUB_STEP_SUMMARY && cat pytest.log >> $GITHUB_STEP_SUMMARY && exit 1)

    - name: Build Docker image and assert HAS_NATIVE
      if: matrix.python-version == '3.10'
      run: |
        docker build -t vsearch:test .
        docker run --rm vsearch:test python -c "import vsearch.hnsw; print('HAS_NATIVE in Docker:', vsearch.hnsw.HAS_NATIVE); assert vsearch.hnsw.HAS_NATIVE is True, 'Native extension failed to load in Docker runtime!'"
